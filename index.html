<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Person Chat</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">

        <div class="chat-header">
            <div class="header-title-container">
                <!-- <h2>Simple Chat</h2> -->
                <!-- <h1>⛩️</h1> -->
                <svg class="sakura-tree-logo" width="44" height="44" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" title="Sakura Tree">
                    <!-- Broad Single Trunk -->
                    <path d="M 40,92 C 43,72 44,56 45,52 L 55,52 C 56,56 57,72 60,92 Z" fill="#5C4033"/>
                    <!-- Trunk shading details for depth -->
                    <path d="M 45,92 C 47,75 48,64 48,53" stroke="#4A342B" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M 52,92 C 53,78 53,67 52,53" stroke="#705244" stroke-width="1" stroke-linecap="round"/>
                    <!-- Broad Roots -->
                    <path d="M 32,92 C 38,90 44,91 50,91 C 56,91 62,90 68,92" stroke="#5C4033" stroke-width="3" stroke-linecap="round"/>
                    
                    <!-- Wide-Spreading Top Branches -->
                    <path d="M 46,54 C 40,46 30,42 12,42" stroke="#5C4033" stroke-width="3.5" stroke-linecap="round"/>
                    <path d="M 33,46 C 26,42 20,38 10,38" stroke="#5C4033" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M 54,54 C 60,46 70,42 88,42" stroke="#5C4033" stroke-width="3.5" stroke-linecap="round"/>
                    <path d="M 67,46 C 74,42 80,38 90,38" stroke="#5C4033" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M 48,52 C 45,40 38,32 26,26" stroke="#5C4033" stroke-width="3" stroke-linecap="round"/>
                    <path d="M 52,52 C 55,40 62,32 74,26" stroke="#5C4033" stroke-width="3" stroke-linecap="round"/>
                    <path d="M 50,52 C 50,42 47,34 44,20" stroke="#5C4033" stroke-width="3" stroke-linecap="round"/>
                    <path d="M 50,52 C 50,42 53,34 56,20" stroke="#5C4033" stroke-width="3" stroke-linecap="round"/>

                    <!-- Lush Wide-Spread Foliage Canopies -->
                    <!-- Background shadows (large pink circles) -->
                    <circle cx="50" cy="22" r="22" fill="#F472B6" opacity="0.45"/>
                    <circle cx="26" cy="30" r="20" fill="#F472B6" opacity="0.45"/>
                    <circle cx="74" cy="30" r="20" fill="#F472B6" opacity="0.45"/>
                    <circle cx="12" cy="40" r="15" fill="#F472B6" opacity="0.4"/>
                    <circle cx="88" cy="40" r="15" fill="#F472B6" opacity="0.4"/>

                    <!-- Midground main cherry blossom pink -->
                    <circle cx="50" cy="18" r="18" fill="#EC4899" opacity="0.75"/>
                    <circle cx="28" cy="26" r="16" fill="#EC4899" opacity="0.75"/>
                    <circle cx="72" cy="26" r="16" fill="#EC4899" opacity="0.75"/>
                    <circle cx="15" cy="36" r="12" fill="#EC4899" opacity="0.8"/>
                    <circle cx="85" cy="36" r="12" fill="#EC4899" opacity="0.8"/>

                    <!-- Foreground bright highlighting soft pinks -->
                    <circle cx="48" cy="14" r="13" fill="#FBCFE8" opacity="0.95"/>
                    <circle cx="32" cy="20" r="12" fill="#FBCFE8" opacity="0.95"/>
                    <circle cx="68" cy="20" r="12" fill="#FBCFE8" opacity="0.95"/>
                    <circle cx="18" cy="30" r="10" fill="#FBCFE8" opacity="0.95"/>
                    <circle cx="82" cy="30" r="10" fill="#FBCFE8" opacity="0.95"/>
                    <circle cx="50" cy="28" r="15" fill="#FBCFE8" opacity="0.9"/>

                    <!-- Individual cherry blossom highlights -->
                    <circle cx="10" cy="38" r="3" fill="#FBCFE8"/>
                    <circle cx="90" cy="38" r="3" fill="#FBCFE8"/>
                    <circle cx="24" cy="24" r="4.5" fill="#F472B6"/>
                    <circle cx="76" cy="24" r="4.5" fill="#F472B6"/>
                    <circle cx="50" cy="9" r="4" fill="#FBCFE8"/>

                    <!-- Dynamic Falling Leaves (animated via CSS) -->
                    <path class="falling-leaf leaf-1" d="M 30,30 C 29,28 27,28 28,30 C 29,32 32,31 31,30 Z" fill="#FBCFE8"/>
                    <path class="falling-leaf leaf-2" d="M 70,28 C 69,26 67,26 68,28 C 69,30 72,29 71,28 Z" fill="#EC4899"/>
                    <path class="falling-leaf leaf-3" d="M 45,24 C 44,22 42,22 43,24 C 44,26 47,25 46,24 Z" fill="#F472B6"/>
                    <path class="falling-leaf leaf-4" d="M 55,26 C 54,24 52,24 53,26 C 54,28 57,27 56,26 Z" fill="#FBCFE8"/>
                    <path class="falling-leaf leaf-5" d="M 20,34 C 19,32 17,32 18,34 C 19,36 22,35 21,34 Z" fill="#EC4899"/>
                    <path class="falling-leaf leaf-6" d="M 80,34 C 79,32 77,32 78,34 C 79,36 82,35 81,34 Z" fill="#FBCFE8"/>
                    <path class="falling-leaf leaf-7" d="M 35,26 C 34,24 32,24 33,26 C 34,28 37,27 36,26 Z" fill="#F472B6"/>
                    <path class="falling-leaf leaf-8" d="M 65,28 C 64,26 62,26 63,28 C 64,30 67,29 66,28 Z" fill="#FBCFE8"/>

                    <!-- Dynamic Butterflies (animated via CSS) -->
                    <g class="butterfly butterfly-1">
                        <path class="wing wing-left" d="M 0,0 C -4,-5 -8,-3 -6,1 C -4,4 -1,2 0,0" fill="#60A5FA"/>
                        <path class="wing wing-right" d="M 0,0 C 4,-5 8,-3 6,1 C 4,4 1,2 0,0" fill="#3B82F6"/>
                        <path d="M 0,-4 L 0,3" stroke="#1D4ED8" stroke-width="1.5" stroke-linecap="round"/>
                    </g>
                    <g class="butterfly butterfly-2">
                        <path class="wing wing-left" d="M 0,0 C -4,-5 -8,-3 -6,1 C -4,4 -1,2 0,0" fill="#93C5FD"/>
                        <path class="wing wing-right" d="M 0,0 C 4,-5 8,-3 6,1 C 4,4 1,2 0,0" fill="#2563EB"/>
                        <path d="M 0,-4 L 0,3" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round"/>
                    </g>
                </svg>
                <span id="active-dot" class="status-dot offline" title="Other user is offline"></span>
            </div>
            <div class="header-actions">
                <button id="resetBtn" class="action-btn" title="Reset Room">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                        <path d="M16 3h5v5"/>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                        <path d="M8 21H3v-5"/>
                    </svg>
                </button>
                <button id="refreshBtn" class="action-btn" title="Refresh Page">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="status">Connecting...</div>

        <div id="messages"></div>

        <div id="typing-indicator" class="typing-indicator hidden">
            <span class="typing-text">typing</span>
            <div class="typing-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <div class="input-area">
            <input
                id="messageInput"
                type="text"
                placeholder="Type a message..."
                autofocus
            />

            <button id="sendBtn">
                Send
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
